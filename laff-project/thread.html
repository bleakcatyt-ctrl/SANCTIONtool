<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тема - LAFF PROJECT</title>
  <link rel="stylesheet" href="assets/trace-exact.css?v=5"
  <link rel="stylesheet" href="assets/xenforo-user-menu.css?v=5">
  <link rel="stylesheet" href="assets/reply-exact.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .post { display:grid; grid-template-columns:180px 1fr; border-bottom:1px solid #242424; background:#1c1c1c; }
    @media(max-width:700px){ .post{grid-template-columns:1fr} }
    .post-user { background:#1a1a1a; border-right:1px solid #242424; padding:16px; text-align:center; }
    .post-user img { width:72px; height:72px; border-radius:8px; border:1px solid #2a2a2a; }
    .post-user h4 { margin-top:8px; font-size:13px; color:#e5e7eb; }
    .post-user .role { margin-top:4px; display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; background:#3b82f6; color:white; }
    .post-user .role.admin { background:#dc2626; }
    .post-user .role.mod { background:#8b5cf6; }
    .post-stats { margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:10px; color:#8a8f98; }
    .post-content { padding:16px; }
    .post-content p { margin-bottom:10px; line-height:1.6; color:#cbd5e1; }
    .post-actions { margin-top:12px; display:flex; gap:6px; border-top:1px solid #242424; padding-top:10px; }
    .post-actions button { background:#252525; border:1px solid #2a2a2a; color:#9ca3af; padding:6px 12px; border-radius:6px; font-size:11px; cursor:pointer; }
    .post-actions button:hover { background:#2a2a2a; color:#fff; }
    .like-btn.liked { background: rgba(220,38,38,0.15) !important; color:#ef4444 !important; border-color: rgba(220,38,38,0.3) !important; }
  </style>
</head>
<body>
  <header class="xf-header">
    <div class="xf-header-inner">
      <a href="index.html" class="xf-logo">LAFF <span>PROJECT</span> ☂️</a>
      <nav class="xf-nav">
        <a href="index.html">Главная</a>
        <a href="index.html" class="active">Форум</a>
        <a href="whats-new.html">Что нового</a>
        <a href="users.html">Пользователи</a>
      </nav>
      <div class="xf-nav-right" id="auth-right">
        <a href="index.html">На главную</a>
        <a href="#" class="search"><i class="fa-solid fa-magnifying-glass"></i> Поиск</a>
      </div>
    </div>
  </header>
  <div class="xf-subnav">
    <div class="xf-subnav-inner">
      <a href="index.html">Главная</a> <span style="color:#4a4a4a">›</span> <a href="index.html">Форум</a> <span style="color:#4a4a4a">›</span> <span style="color:#e5e7eb" id="breadcrumb-title">Тема</span>
    </div>
  </div>

  <div class="xf-page">
    <main>
      <div id="thread-view" style="background:#1c1c1c; border:1px solid #2a2a2a; border-radius:8px; overflow:hidden;"></div>

      <!-- REPLY EDITOR EXACT LIKE SCREENSHOT BUT IN LAFF STYLE (BLUE NOT RED) -->
      <div id="reply-section" style="margin-top:20px;">
        <div class="reply-container">
          <div class="reply-toolbar">
            <button title="Удалить форматирование"><i class="fa-solid fa-eraser"></i></button>
            <button title="Жирный" data-cmd="bold"><i class="fa-solid fa-bold"></i></button>
            <button title="Курсив" data-cmd="italic"><i class="fa-solid fa-italic"></i></button>
            <button title="Подчеркнутый" data-cmd="underline"><i class="fa-solid fa-underline"></i></button>
            <button title="Зачеркнутый" data-cmd="strikeThrough"><i class="fa-solid fa-strikethrough"></i></button>
            <button title="Цвет текста"><i class="fa-solid fa-palette"></i></button>
            <div class="sep"></div>
            <button title="Список" data-cmd="insertUnorderedList"><i class="fa-solid fa-list-ul"></i></button>
            <button title="Нумерованный список" data-cmd="insertOrderedList"><i class="fa-solid fa-list-ol"></i></button>
            <button title="Отступ"><i class="fa-solid fa-indent"></i></button>
            <div class="sep"></div>
            <button title="Ссылка" data-cmd="link"><i class="fa-solid fa-link"></i></button>
            <button title="Изображение" data-cmd="image"><i class="fa-regular fa-image"></i></button>
            <button title="Смайлы"><i class="fa-regular fa-face-smile"></i></button>
            <button title="Медиа"><i class="fa-solid fa-photo-film"></i></button>
            <button title="Цитата" data-cmd="quote"><i class="fa-solid fa-quote-left"></i></button>
            <button title="Код" data-cmd="code"><i class="fa-solid fa-code"></i></button>
            <button title="Таблица"><i class="fa-solid fa-table"></i></button>
            <div class="sep"></div>
            <button title="Отменить" data-cmd="undo"><i class="fa-solid fa-rotate-left"></i></button>
            <button title="Повторить" data-cmd="redo"><i class="fa-solid fa-rotate-right"></i></button>
            <button title="BB-коды">[ ]</button>
            <button title="Еще"><i class="fa-solid fa-ellipsis"></i> <i class="fa-solid fa-caret-down" style="font-size:8px"></i></button>
            <button class="preview-btn" onclick="previewPost()"><i class="fa-regular fa-file-lines"></i> Предварительный просмотр</button>
          </div>
          <div id="replyEditor" class="reply-textarea" contenteditable="true" data-placeholder="Напишите ответ..."></div>
          <div class="reply-settings">
            <div class="reply-settings-label">Настройки:</div>
            <div>
              <div class="reply-checkbox">
                <input type="checkbox" id="watchThread">
                <label for="watchThread">Отслеживать эту тему...</label>
              </div>
              <div class="reply-checkbox" style="margin-left:20px;">
                <input type="checkbox" id="emailNotify">
                <label for="emailNotify">и получать уведомления на электронную почту</label>
              </div>
            </div>
          </div>
          <div class="reply-footer">
            <button class="reply-btn" id="replyBtn" onclick="postReply()"><i class="fa-solid fa-reply"></i> ОТВЕТ</button>
          </div>
        </div>
        <div id="previewBox" style="display:none; margin-top:12px; background:#1c1c1c; border:1px solid #2a2a2a; border-radius:8px; padding:16px;">
          <h4 style="font-size:12px; color:#8a8f98; margin-bottom:8px; text-transform:uppercase;">Предпросмотр:</h4>
          <div id="previewContent" style="color:#cbd5e1; line-height:1.6;"></div>
        </div>
      </div>
    </main>
    <aside class="xf-sidebar">
      <div class="xf-side-card">
        <div class="xf-side-header">Информация</div>
        <div class="xf-side-body" style="font-size:12px; color:#8a8f98;">
          <div>Автор: <b style="color:#e5e7eb" id="info-author">—</b></div>
          <div style="margin-top:4px;">Просмотров: <span id="info-views">—</span></div>
          <div style="margin-top:8px;"><button onclick="navigator.clipboard.writeText(location.href)" style="width:100%; background:#252525; border:1px solid #2a2a2a; color:#9ca3af; padding:6px; border-radius:6px; cursor:pointer;">Поделиться</button></div>
        </div>
      </div>
      <div class="xf-side-card">
        <div class="xf-side-header">Сейчас онлайн</div>
        <div class="xf-side-body" id="online-users"></div>
      </div>
    </aside>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/xenforo.js?v=5"></script>
  <script>
    function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    
    // Toolbar commands
    document.querySelectorAll('.reply-toolbar [data-cmd]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.preventDefault();
        const cmd = btn.getAttribute('data-cmd');
        document.getElementById('replyEditor').focus();
        switch(cmd){
          case 'quote': document.execCommand('formatBlock', false, 'blockquote'); break;
          case 'code': document.execCommand('formatBlock', false, 'pre'); break;
          case 'link': 
            const url = prompt('Введите URL:');
            if(url) document.execCommand('createLink', false, url);
            break;
          case 'image':
            const img = prompt('URL изображения:');
            if(img) document.execCommand('insertImage', false, img);
            break;
          default: document.execCommand(cmd, false, null);
        }
      });
    });

    function previewPost(){
      const editor = document.getElementById('replyEditor');
      const box = document.getElementById('previewBox');
      const content = document.getElementById('previewContent');
      if(box.style.display==='none'){
        content.innerHTML = editor.innerHTML || '<span style="color:#6b7280;">Пусто</span>';
        box.style.display='block';
        editor.scrollIntoView({behavior:'smooth'});
      } else {
        box.style.display='none';
      }
    }

    let currentThreadId = null;

    async function loadThread(){
      const id = new URLSearchParams(location.search).get('id');
      if(!id) return;
      currentThreadId = id;
      const container = document.getElementById('thread-view');
      container.innerHTML = '<div style="padding:40px; text-align:center; color:#8a8f98;">Загрузка...</div>';
      try {
        const t = await LaffAPI.fetchThread(id);
        document.getElementById('info-author').textContent = t.author;
        document.getElementById('info-views').textContent = t.views;
        document.getElementById('breadcrumb-title').textContent = t.title.substring(0,40);
        container.innerHTML = `
          <div style="padding:16px 20px; border-bottom:1px solid #2a2a2a;">
            <h1 style="font-size:18px; font-weight:700; color:#fff;">${t.pinned?'📌 ':''}${escapeHtml(t.title)}</h1>
            <div style="margin-top:6px; font-size:11px; color:#8a8f98; display:flex; gap:12px;">
              <span>👤 ${t.author}</span><span>🕒 ${new Date(t.created_at).toLocaleDateString()}</span><span>👁️ ${t.views}</span><span>💬 ${t.posts.length}</span>
            </div>
          </div>
          <div class="post">
            <div class="post-user">
              <img src="${t.avatar}">
              <h4>${t.author}</h4>
              <div class="role ${t.role.includes('ОСНОВАТЕЛЬ')||t.role.includes('ГЛ.')?'admin':t.role.includes('ТЕХ')?'mod':''}">${t.role}</div>
              <div class="post-stats"><div><b>${t.author_messages||0}</b><br>сообщений</div><div><b>${t.author_rep||0}</b><br>репутация</div></div>
            </div>
            <div class="post-content">
              <div style="white-space:pre-wrap; color:#cbd5e1;">${escapeHtml(t.content)}</div>
              <div class="post-actions">
                <button class="like-btn" onclick="likeThread(${t.id}, this)"><i class="fa-solid fa-heart"></i> Нравится (${t.likes||0})</button>
                <button onclick="document.getElementById('replyEditor').focus()"><i class="fa-solid fa-reply"></i> Ответить</button>
              </div>
            </div>
          </div>
          <div id="posts-list">
            ${t.posts.map(p=>`
              <div class="post">
                <div class="post-user">
                  <img src="${p.avatar}">
                  <h4>${p.author}</h4>
                  <div class="role ${p.role.includes('ОСНОВАТЕЛЬ')||p.role.includes('ГЛ.')?'admin':p.role.includes('ТЕХ')?'mod':''}">${p.role}</div>
                  <div class="post-stats"><div><b>${p.author_messages||0}</b><br>сообщений</div><div><b>${p.author_rep||0}</b><br>репутация</div></div>
                </div>
                <div class="post-content">
                  <div style="font-size:10px; color:#6b7280; margin-bottom:6px;">${new Date(p.created_at).toLocaleString()}</div>
                  <div style="white-space:pre-wrap; color:#cbd5e1;">${escapeHtml(p.content)}</div>
                  <div class="post-actions">
                    <button class="like-btn" onclick="likePost(${p.id}, this)"><i class="fa-solid fa-heart"></i> ${p.likes||0}</button>
                    <button onclick="quotePost('${escapeHtml(p.author)}', \`${escapeHtml(p.content).substring(0,150)}\`)"><i class="fa-solid fa-quote-left"></i> Цитата</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } catch(e){ container.innerHTML = `<div style="padding:40px; text-align:center; color:#ef4444;">${e.message}</div>`; }
    }

    async function postReply(){
      const editor = document.getElementById('replyEditor');
      const content = editor.innerText.trim();
      if(!content) return alert('Напишите ответ...');
      if(!LaffAPI.getUser()) return alert('Войдите чтобы ответить');
      const btn = document.getElementById('replyBtn');
      btn.disabled = true;
      btn.innerHTML = 'Отправка...';
      try {
        const threadId = currentThreadId;
        const watch = document.getElementById('watchThread').checked;
        const emailNotify = document.getElementById('emailNotify').checked;
        
        await LaffAPI.replyThread(threadId, content);
        
        // Save watch preference if checked
        if(watch){
          try { await fetch(`/api/threads/${threadId}/watch`, { method:'POST', headers:{'Authorization':'Bearer '+LaffAPI.getToken(), 'Content-Type':'application/json'}, body: JSON.stringify({ emailNotify }) }); } catch {}
        }
        
        location.reload();
      } catch(e){
        alert(e.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-reply"></i> ОТВЕТ';
      }
    }

    async function likeThread(id, btn){
      if(!LaffAPI.getUser()) return alert('Войдите');
      try {
        const r = await LaffAPI.likeThread(id);
        btn.classList.toggle('liked', r.liked);
        const m = btn.textContent.match(/\d+/); let c = m?parseInt(m[0]):0;
        btn.innerHTML = `<i class="fa-solid fa-heart"></i> Нравится (${r.liked?c+1:Math.max(0,c-1)})`;
      } catch(e){ alert(e.message); }
    }
    async function likePost(id, btn){
      if(!LaffAPI.getUser()) return alert('Войдите');
      try {
        const r = await LaffAPI.likePost(id);
        btn.classList.toggle('liked', r.liked);
        let c = parseInt(btn.textContent)||0;
        btn.innerHTML = `<i class="fa-solid fa-heart"></i> ${r.liked?c+1:Math.max(0,c-1)}`;
      } catch(e){ alert(e.message); }
    }
    function quotePost(author, content){
      const editor = document.getElementById('replyEditor');
      editor.innerHTML = `<blockquote style="border-left:3px solid #3b82f6; background:rgba(59,130,246,0.1); padding:8px 12px; margin:8px 0; border-radius:0 6px 6px 0;"><b>${author} писал:</b><br>${content}</blockquote><br>`;
      editor.focus();
      document.getElementById('replyEditor').scrollIntoView({behavior:'smooth'});
    }
    async function loadOnline(){
      try {
        const users = await LaffAPI.fetchOnline();
        document.getElementById('online-users').innerHTML = users.map(u=>`<div style="font-size:12px; color:${u.color}; padding:2px 0;">${u.name} - ${u.role}</div>`).join('') || '<div style="color:#8a8f98; font-size:12px;">Нет онлайн</div>';
      } catch {}
    }
    function initAuth(){
      const user = LaffAPI.getUser();
      const right = document.getElementById('auth-right');
      if(user){
        const isAdmin = ['ОСНОВАТЕЛЬ','ГЛ. АДМИН','ТЕХ. АДМИН'].includes(user.role);
        right.innerHTML = `
          ${isAdmin?`<a href="admin.html" style="background:#dc2626; color:white; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:600;"><i class="fa-solid fa-shield"></i> Админка</a>`:''}
          <div style="display:flex; align-items:center; gap:8px; background:#1c1c1c; border:1px solid #2a2a2a; padding:4px 10px 4px 4px; border-radius:999px;">
            <img src="${user.avatar}" style="width:24px; height:24px; border-radius:50%;">
            <span style="font-size:12px; font-weight:600; color:#fff;">${user.username}</span>
          </div>
          <a href="#" onclick="LaffAPI.logout()" style="color:#8a8f98;"><i class="fa-solid fa-right-from-bracket"></i></a>
        `;
      }
    }
    document.addEventListener('DOMContentLoaded', ()=>{
      loadThread(); loadOnline(); initAuth();
      if(LaffAPI.getToken()){ LaffAPI.fetchMe().then(()=>initAuth()).catch(()=>{}); }
    });
  </script>
</body>
</html>
