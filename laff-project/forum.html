<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форум - LAFF PROJECT</title>
  <link rel="stylesheet" href="assets/trace-exact.css">
  <link rel="stylesheet" href="assets/editor.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .thread-row { display:grid; grid-template-columns:48px 1fr 100px 80px; gap:12px; padding:12px 14px; border-bottom:1px solid #242424; align-items:center; background:#1c1c1c; }
    .thread-row:hover { background:#212121; }
    .thread-row.pinned { background: rgba(59,130,246,0.06); }
    .thread-avatar img { width:36px; height:36px; border-radius:6px; }
    .thread-main h3 { font-size:13.5px; font-weight:600; color:#e5e7eb; }
    .thread-meta { font-size:11px; color:#8a8f98; margin-top:2px; }
    .thread-stats { text-align:center; font-size:12px; }
    .thread-stats b { display:block; color:#e5e7eb; }
    .thread-stats span { font-size:11px; color:#8a8f98; }
  </style>
</head>
<body>
  <header class="xf-header">
    <div class="xf-header-inner">
      <a href="index.html" class="xf-logo">LAFF <span>PROJECT</span> ☂️</a>
      <nav class="xf-nav">
        <a href="index.html">Главная</a>
        <a href="index.html" class="active">Форум</a>
        <a href="#">Что нового <i class="fa-solid fa-caret-down" style="font-size:10px"></i></a>
        <a href="#">Пользователи <i class="fa-solid fa-caret-down" style="font-size:10px"></i></a>
      </nav>
      <div class="xf-nav-right">
        <a href="index.html">На главную</a>
        <a href="#" class="search"><i class="fa-solid fa-magnifying-glass"></i> Поиск</a>
      </div>
    </div>
  </header>
  <div class="xf-subnav">
    <div class="xf-subnav-inner">
      <a href="index.html">Главная</a> <span style="color:#4a4a4a">›</span> <a href="index.html">Форум</a> <span style="color:#4a4a4a">›</span> <span id="forum-title" style="color:#e5e7eb">Загрузка...</span>
    </div>
  </div>

  <div class="xf-page">
    <main>
      <div class="xf-page-header">
        <h1 id="forum-title-h">Форум</h1>
        <button class="btn-new" onclick="openNewThread()"><i class="fa-solid fa-plus"></i> Создать тему</button>
      </div>
      <div class="xf-category">
        <div class="xf-category-header" id="forum-desc">Темы раздела</div>
        <div id="thread-list"><div style="padding:20px; color:#8a8f98;">Загрузка...</div></div>
      </div>
    </main>
    <aside class="xf-sidebar">
      <div class="xf-side-card">
        <div class="xf-side-header">Информация</div>
        <div class="xf-side-body" style="font-size:12px; color:#8a8f98;">Раздел форума LAFF PROJECT. Создавайте темы, используйте WYSIWYG редактор и лайки.</div>
      </div>
      <div class="xf-side-card">
        <div class="xf-side-header">Пользователи онлайн</div>
        <div class="xf-side-body" id="online-users"></div>
      </div>
    </aside>
  </div>

  <div id="newThreadModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); place-items:center; z-index:100; padding:20px;">
    <div style="background:#1c1c1c; border:1px solid #2a2a2a; border-radius:8px; width:100%; max-width:600px; padding:20px;">
      <h3 style="color:#fff; margin-bottom:12px;">Новая тема</h3>
      <input id="newTitle" placeholder="Заголовок" style="width:100%; background:#111; border:1px solid #2a2a2a; border-radius:6px; padding:10px; color:#fff; margin-bottom:10px;">
      <div id="newThreadEditor" style="margin-bottom:12px;"></div>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button onclick="document.getElementById('newThreadModal').style.display='none'" style="background:#252525; color:#9ca3af; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;">Отмена</button>
        <button onclick="createThread()" style="background:#3b82f6; color:white; border:none; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer;">Создать</button>
      </div>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/editor.js"></script>
  <script>
    let editor;
    function openNewThread(){
      if(!LaffAPI.getUser()){ alert('Войдите'); return; }
      document.getElementById('newThreadModal').style.display='grid';
      if(!editor) editor = new LaffEditor('newThreadEditor', { placeholder:'Текст темы...' });
    }
    async function createThread(){
      const title = document.getElementById('newTitle').value.trim();
      const content = editor ? editor.getText().trim() : '';
      if(!title || !content) return alert('Заполните поля');
      const forumId = new URLSearchParams(location.search).get('f') || 'news';
      try {
        const t = await LaffAPI.createThread(forumId, title, content);
        location.href = `thread.html?id=${t.id}&f=${forumId}`;
      } catch(e){ alert(e.message); }
    }
    async function loadThreads(){
      const forumId = new URLSearchParams(location.search).get('f') || 'news';
      const titleEl = document.getElementById('forum-title');
      const titleH = document.getElementById('forum-title-h');
      const descEl = document.getElementById('forum-desc');
      try {
        const forums = await LaffAPI.fetchForums();
        const forum = forums.flatMap(c=>c.forums).find(f=>f.id===forumId);
        if(forum){ titleEl.textContent = forum.title; titleH.textContent = forum.title; descEl.textContent = forum.desc; }
      } catch {}
      try {
        const threads = await LaffAPI.fetchThreads(forumId);
        const list = document.getElementById('thread-list');
        if(!threads.length){ list.innerHTML = '<div style="padding:40px; text-align:center; color:#8a8f98;">Нет тем. Будьте первым!</div>'; return; }
        list.innerHTML = threads.map(t=>`
          <a href="thread.html?id=${t.id}&f=${forumId}" class="thread-row ${t.pinned?'pinned':''}">
            <div class="thread-avatar"><img src="${t.avatar}"></div>
            <div class="thread-main">
              <h3>${t.pinned?'📌 ':''}${t.title}</h3>
              <div class="thread-meta">${t.author} • ${new Date(t.created_at).toLocaleDateString()} • ${t.role}</div>
            </div>
            <div class="thread-stats"><b>${t.replies||0}</b><span>Ответов</span></div>
            <div class="thread-stats"><b>${t.views||0}</b><span>Просмотров</span></div>
          </a>
        `).join('');
      } catch(e){ document.getElementById('thread-list').innerHTML = `<div style="padding:20px; color:#ef4444;">${e.message}</div>`; }
    }
    async function loadOnline(){
      try {
        const users = await LaffAPI.fetchOnline();
        document.getElementById('online-users').innerHTML = users.map(u=>`<div style="font-size:12px; color:${u.color}; padding:2px 0;">${u.name}</div>`).join('');
      } catch {}
    }
    document.addEventListener('DOMContentLoaded', ()=>{ loadThreads(); loadOnline(); });
  </script>
</body>
</html>
