<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форум - LAFF PROJECT ☂️</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/editor.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand"><div class="brand-logo">L</div><div><div class="brand-text">LAFF <span>PROJECT</span></div><div class="brand-sub">ROLE PLAY • RAGE MP</div></div></a>
      <nav class="nav">
        <a href="index.html"><i class="fa-solid fa-house"></i> Главная</a>
        <a href="index.html" class="active"><i class="fa-solid fa-comments"></i> Форум</a>
        <a href="#"><i class="fa-solid fa-bolt"></i> Что нового</a>
        <a href="#"><i class="fa-solid fa-users"></i> Пользователи</a>
      </nav>
      <div class="actions">
        <div class="search-box"><input id="searchInput" placeholder="Поиск..."><i class="fa-solid fa-magnifying-glass"></i></div>
        <button class="btn btn-ghost" data-modal="loginModal">Войти</button>
        <button class="btn btn-primary" data-modal="registerModal">Регистрация</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="breadcrumbs">
      <a href="index.html">Главная</a> <i class="fa-solid fa-chevron-right"></i> <a href="index.html">Форум</a> <i class="fa-solid fa-chevron-right"></i> <span id="forum-title">Загрузка...</span>
    </div>

    <main>
      <div class="category">
        <div class="cat-header">
          <div class="cat-icon">📁</div>
          <div><div class="cat-title" id="forum-title">Форум</div><div class="cat-desc" id="forum-desc">Описание форума</div></div>
          <button class="btn btn-primary" style="margin-left:auto" onclick="openNewThread()"><i class="fa-solid fa-plus"></i> Создать тему</button>
        </div>
        <div id="thread-list"></div>
      </div>
    </main>

    <aside class="sidebar">
      <div class="side-card">
        <div class="side-head">Информация</div>
        <div class="side-body" style="font-size:12px;color:var(--text-dim);line-height:1.6">
          <p>Это раздел форума LAFF PROJECT с бэкендом. Создавайте темы, ставьте лайки, используйте WYSIWYG редактор.</p>
          <button class="btn btn-ghost" style="width:100%;margin-top:12px"><i class="fa-solid fa-book"></i> Правила раздела</button>
        </div>
      </div>
      <div class="side-card"><div class="side-head">Сейчас онлайн</div><div class="side-body"><div id="online-users" class="online-list"></div></div></div>
    </aside>
  </div>

  <div id="newThreadModal" class="modal-backdrop">
    <div class="modal" style="max-width:700px">
      <div class="modal-head"><h3>Новая тема</h3><button class="btn btn-ghost btn-icon" data-close><i class="fa-solid fa-xmark"></i></button></div>
      <div class="modal-body">
        <div class="form-row"><label>Заголовок</label><input id="newTitle" class="input" placeholder="Название темы"></div>
        <div class="form-row"><label>Сообщение</label><div id="newThreadEditor"></div></div>
        <button class="btn btn-primary" style="width:100%" onclick="createThread()"><i class="fa-solid fa-paper-plane"></i> Создать тему</button>
      </div>
    </div>
  </div>

  <div id="loginModal" class="modal-backdrop"><div class="modal"><div class="modal-head"><h3>Вход</h3><button class="btn btn-ghost btn-icon" data-close><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body"><div class="form-row"><label>Логин</label><input class="input" placeholder="Maestro"></div><div class="form-row"><label>Пароль</label><input type="password" class="input" placeholder="laff2025"></div><button class="btn btn-primary" style="width:100%">Войти</button></div></div></div>
  <div id="registerModal" class="modal-backdrop"><div class="modal"><div class="modal-head"><h3>Регистрация</h3><button class="btn btn-ghost btn-icon" data-close><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body"><div class="form-row"><label>Ник</label><input class="input" placeholder="John_Laff"></div><div class="form-row"><label>Email</label><input class="input" placeholder="you@example.com"></div><div class="form-row"><label>Пароль</label><input type="password" class="input"></div><div class="form-row"><label>Статический ID</label><input class="input"></div><button class="btn btn-primary" style="width:100%">Создать</button></div></div></div>

  <script src="assets/api.js"></script>
  <script src="assets/editor.js"></script>
  <script src="assets/app-v2.js"></script>
  <script>
    let newThreadEditor;
    function openNewThread(){
      if (!LaffAPI.getUser()){ alert('Войдите чтобы создавать темы'); document.getElementById('loginModal').classList.add('open'); return; }
      document.getElementById('newThreadModal').classList.add('open');
      if (!newThreadEditor) newThreadEditor = new LaffEditor('newThreadEditor', { placeholder: 'Текст темы...' });
    }
    async function createThread(){
      const title = document.getElementById('newTitle').value.trim();
      const content = newThreadEditor ? newThreadEditor.getText().trim() : '';
      if (!title) return alert('Введите заголовок');
      if (!content) return alert('Введите текст');
      const params = new URLSearchParams(location.search);
      const forumId = params.get('f') || 'news';
      try {
        const thread = await LaffAPI.createThread(forumId, title, content);
        location.href = `thread.html?id=${thread.id}&f=${forumId}`;
      } catch(e){ alert(e.message); }
    }
  </script>
</body>
</html>
